<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="Учет поездок из Калуги — удобное PWA">
  <title>Поездки Калуга</title>
  
  <!-- Tailwind CSS через CDN + минимальные кастомные стили -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js для статистики -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  
  <!-- Встроенный манифест (Data URL) -->
  <script>
    const manifestBlob = new Blob([JSON.stringify({
      name: "Поездки Калуга",
      short_name: "Калуга Поездки",
      start_url: ".",
      display: "standalone",
      background_color: "#0f172a",
      theme_color: "#0f172a",
      description: "Учет автомобильных поездок из Калуги",
      icons: [
        {
          src: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚗</text></svg>",
          sizes: "any",
          type: "image/svg+xml"
        }
      ]
    })], { type: "application/json" });
    const manifestURL = URL.createObjectURL(manifestBlob);
    document.querySelector('link[rel="manifest"]')?.remove();
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = manifestURL;
    document.head.appendChild(link);
  </script>

  <style>
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 80px; /* место для нижней навигации */
    }
    .glass-card {
      background: rgba(30, 41, 59, 0.8);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(71, 85, 105, 0.3);
      border-radius: 1.5rem;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }
    .fab {
      box-shadow: 0 8px 24px rgba(59, 130, 246, 0.4);
      transition: transform 0.2s ease, box-shadow 0.2s;
    }
    .fab:active {
      transform: scale(0.95);
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.6);
    }
    .modal-overlay {
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .nav-item {
      transition: all 0.2s ease;
    }
    .nav-item.active {
      color: #60a5fa;
      background: rgba(59, 130, 246, 0.15);
      border-radius: 1rem;
    }
    input, select, textarea {
      background: #1e293b;
      border: 1px solid #334155;
      color: #f1f5f9;
      border-radius: 0.75rem;
      padding: 0.75rem 1rem;
      width: 100%;
      outline: none;
      transition: border 0.2s;
    }
    input:focus, select:focus, textarea:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 2px rgba(59,130,246,0.3);
    }
    button {
      transition: all 0.2s;
    }
    .trip-card {
      transition: transform 0.15s;
    }
    .trip-card:active {
      transform: scale(0.98);
    }
    /* убрать стрелки у number */
    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { 
      -webkit-appearance: none; 
      margin: 0; 
    }
    input[type=number] { -moz-appearance: textfield; }
  </style>
</head>
<body class="antialiased">

  <!-- Контейнер приложения -->
  <div id="app" class="flex flex-col max-w-md mx-auto w-full px-4 pt-6 relative min-h-screen">
    
    <!-- Заголовок + переключение экранов -->
    <header class="flex items-center justify-between mb-6">
      <h1 class="text-2xl font-bold tracking-tight bg-gradient-to-r from-blue-400 to-cyan-300 bg-clip-text text-transparent">
        🚗 Поездки Калуга
      </h1>
      <span id="currentMonthDisplay" class="text-sm text-slate-400 bg-slate-800 px-3 py-1 rounded-full"></span>
    </header>

    <!-- Динамический контент (Главная / История / Статистика) -->
    <main id="mainContent" class="flex-1 pb-4"></main>

    <!-- Нижняя навигация -->
    <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-slate-900/90 backdrop-blur-md border-t border-slate-700 flex justify-around items-center py-3 px-2 rounded-t-3xl z-40">
      <button data-tab="dashboard" class="nav-item active flex flex-col items-center gap-1 px-4 py-2 text-slate-300">
        <span class="text-xl">🏠</span>
        <span class="text-xs font-medium">Главная</span>
      </button>
      <button data-tab="history" class="nav-item flex flex-col items-center gap-1 px-4 py-2 text-slate-300">
        <span class="text-xl">📋</span>
        <span class="text-xs font-medium">История</span>
      </button>
      <button data-tab="stats" class="nav-item flex flex-col items-center gap-1 px-4 py-2 text-slate-300">
        <span class="text-xl">📊</span>
        <span class="text-xs font-medium">Статистика</span>
      </button>
    </nav>

    <!-- FAB кнопка добавить поездку -->
    <button id="fabButton" class="fab fixed bottom-24 right-5 w-14 h-14 bg-blue-600 hover:bg-blue-500 text-white rounded-full flex items-center justify-center text-3xl shadow-2xl z-30">
      <span class="leading-none">+</span>
    </button>
  </div>

  <!-- Модальное окно добавления/редактирования поездки -->
  <div id="tripModal" class="fixed inset-0 z-50 hidden items-center justify-center px-4">
    <div class="modal-overlay absolute inset-0" id="modalOverlay"></div>
    <div class="glass-card relative w-full max-w-sm p-6 z-10 animate-fade-in">
      <h2 id="modalTitle" class="text-xl font-semibold mb-4 text-white">Новая поездка</h2>
      <form id="tripForm" class="space-y-4">
        <input type="hidden" id="tripId">
        <div>
          <label class="text-sm text-slate-300 block mb-1">Дата</label>
          <input type="date" id="tripDate" required>
        </div>
        <div>
          <label class="text-sm text-slate-300 block mb-1">Населённый пункт</label>
          <input type="text" id="tripDestination" placeholder="Обнинск, Москва..." required>
        </div>
        <div>
          <label class="text-sm text-slate-300 block mb-1">Расстояние в одну сторону (км)</label>
          <input type="number" id="tripDistance" placeholder="85" min="1" step="any" required>
        </div>
        <div>
          <label class="text-sm text-slate-300 block mb-1">Примечание (опционально)</label>
          <textarea id="tripNote" rows="2" placeholder="Цель поездки..."></textarea>
        </div>
        <div class="bg-slate-800 p-3 rounded-xl text-center">
          <span class="text-sm text-slate-300">Туда-обратно: </span>
          <span id="roundTripPreview" class="text-lg font-bold text-blue-400">0 км</span>
        </div>
        <div class="flex gap-3 pt-2">
          <button type="button" id="cancelModalBtn" class="flex-1 bg-slate-700 hover:bg-slate-600 py-2.5 rounded-xl text-white">Отмена</button>
          <button type="submit" class="flex-1 bg-blue-600 hover:bg-blue-500 py-2.5 rounded-xl text-white font-medium">Сохранить</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    (function() {
      // ---------- Service Worker (базовый для PWA) ----------
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('data:application/javascript,' + encodeURIComponent(
            "self.addEventListener('install', e => self.skipWaiting());" +
            "self.addEventListener('activate', e => e.waitUntil(clients.claim()));" +
            "self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => caches.match(e.request))));"
          )).catch(err => console.log('SW регистрация (офлайн-поддержка):', err));
        });
      }

      // ---------- Состояние приложения ----------
      const STORAGE_KEY = 'kaluga_trips_v1';
      let trips = [];            // массив объектов поездок
      let currentTab = 'dashboard'; // dashboard | history | stats
      let editingId = null;     // id редактируемой поездки

      // Элементы DOM
      const mainContent = document.getElementById('mainContent');
      const fabButton = document.getElementById('fabButton');
      const modal = document.getElementById('tripModal');
      const modalOverlay = document.getElementById('modalOverlay');
      const cancelModalBtn = document.getElementById('cancelModalBtn');
      const tripForm = document.getElementById('tripForm');
      const tripIdInput = document.getElementById('tripId');
      const tripDateInput = document.getElementById('tripDate');
      const tripDestinationInput = document.getElementById('tripDestination');
      const tripDistanceInput = document.getElementById('tripDistance');
      const tripNoteInput = document.getElementById('tripNote');
      const roundTripPreview = document.getElementById('roundTripPreview');
      const modalTitle = document.getElementById('modalTitle');
      const currentMonthDisplay = document.getElementById('currentMonthDisplay');
      const navButtons = document.querySelectorAll('.nav-item');

      // ---------- Утилиты ----------
      function loadTrips() {
        const stored = localStorage.getItem(STORAGE_KEY);
        trips = stored ? JSON.parse(stored) : [];
        // миграция: убедимся что у всех есть id
        trips = trips.map(t => t.id ? t : { ...t, id: crypto.randomUUID ? crypto.randomUUID() : Date.now() + Math.random() });
        saveTrips();
      }

      function saveTrips() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(trips));
      }

      function getCurrentMonthKey() {
        const now = new Date();
        return `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
      }

      function getMonthName(monthKey) {
        const [year, month] = monthKey.split('-').map(Number);
        return new Date(year, month-1).toLocaleString('ru', { month: 'long', year: 'numeric' });
      }

      function filterTripsByMonth(monthKey) {
        return trips.filter(t => t.date && t.date.startsWith(monthKey));
      }

      function calculateMonthKm(monthKey) {
        return filterTripsByMonth(monthKey).reduce((sum, t) => sum + (t.roundTripKm || 0), 0);
      }

      // Обновление предпросмотра "туда-обратно"
      function updateRoundTripPreview() {
        const dist = parseFloat(tripDistanceInput.value) || 0;
        roundTripPreview.textContent = `${dist * 2} км`;
      }

      // Сброс формы модального окна
      function resetModalForm() {
        tripForm.reset();
        tripIdInput.value = '';
        tripDateInput.value = new Date().toISOString().slice(0,10);
        tripDestinationInput.value = '';
        tripDistanceInput.value = '';
        tripNoteInput.value = '';
        roundTripPreview.textContent = '0 км';
        editingId = null;
        modalTitle.textContent = 'Новая поездка';
      }

      function openModal(trip = null) {
        resetModalForm();
        if (trip) {
          // режим редактирования
          editingId = trip.id;
          tripIdInput.value = trip.id;
          tripDateInput.value = trip.date;
          tripDestinationInput.value = trip.destination;
          tripDistanceInput.value = trip.oneWayKm;
          tripNoteInput.value = trip.note || '';
          updateRoundTripPreview();
          modalTitle.textContent = 'Редактировать поездку';
        } else {
          tripDateInput.value = new Date().toISOString().slice(0,10);
        }
        modal.classList.remove('hidden');
        modal.classList.add('flex');
      }

      function closeModal() {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
        resetModalForm();
      }

      // Сохранение поездки из формы
      function handleFormSubmit(e) {
        e.preventDefault();
        const date = tripDateInput.value;
        const destination = tripDestinationInput.value.trim();
        const oneWayKm = parseFloat(tripDistanceInput.value);
        const note = tripNoteInput.value.trim();

        if (!date || !destination || isNaN(oneWayKm) || oneWayKm <= 0) {
          alert('Пожалуйста, заполните корректно дату, пункт назначения и расстояние.');
          return;
        }

        const roundTripKm = oneWayKm * 2;

        if (editingId) {
          // обновление существующей
          const index = trips.findIndex(t => t.id == editingId);
          if (index !== -1) {
            trips[index] = { ...trips[index], date, destination, oneWayKm, roundTripKm, note };
          }
        } else {
          // новая поездка
          const newTrip = {
            id: crypto.randomUUID ? crypto.randomUUID() : Date.now() + Math.random(),
            date,
            destination,
            oneWayKm,
            roundTripKm,
            note
          };
          trips.push(newTrip);
        }

        saveTrips();
        closeModal();
        renderCurrentTab();
      }

      // Удаление поездки
      function deleteTrip(id) {
        if (confirm('Удалить эту поездку?')) {
          trips = trips.filter(t => t.id != id);
          saveTrips();
          renderCurrentTab();
        }
      }

      // ---------- Рендеринг экранов ----------
      function renderDashboard() {
        const monthKey = getCurrentMonthKey();
        const totalKm = calculateMonthKm(monthKey);
        const recentTrips = trips.slice().sort((a,b) => (b.date || '').localeCompare(a.date || '')).slice(0, 5);

        let html = `
          <div class="glass-card p-5 mb-6">
            <p class="text-slate-400 text-sm">Общий пробег за ${getMonthName(monthKey)}</p>
            <p class="text-4xl font-extrabold text-white mt-1">${totalKm.toLocaleString('ru-RU')} <span class="text-xl text-slate-300">км</span></p>
          </div>
          <div class="flex items-center justify-between mb-3">
            <h2 class="text-lg font-semibold">Последние поездки</h2>
            <button id="goToHistoryBtn" class="text-blue-400 text-sm hover:underline">Все поездки →</button>
          </div>
        `;

        if (recentTrips.length === 0) {
          html += `<div class="text-center py-10 text-slate-500">Нет поездок в этом месяце. Добавьте первую!</div>`;
        } else {
          recentTrips.forEach(trip => {
            html += createTripCardHTML(trip);
          });
        }

        mainContent.innerHTML = html;
        document.getElementById('goToHistoryBtn')?.addEventListener('click', () => switchTab('history'));
        currentMonthDisplay.textContent = getMonthName(monthKey);
      }

      function createTripCardHTML(trip) {
        const dateFormatted = new Date(trip.date).toLocaleDateString('ru', { day: 'numeric', month: 'short' });
        return `
          <div class="trip-card glass-card p-4 mb-3 flex items-center justify-between">
            <div>
              <p class="font-medium text-white">${escapeHtml(trip.destination)}</p>
              <p class="text-xs text-slate-400">${dateFormatted} · ${trip.oneWayKm} км → ${trip.roundTripKm} км общ.</p>
              ${trip.note ? `<p class="text-xs text-slate-500 mt-1 italic">${escapeHtml(trip.note)}</p>` : ''}
            </div>
            <div class="flex gap-2">
              <button data-edit="${trip.id}" class="text-slate-400 hover:text-blue-400 p-1 edit-trip-btn">✏️</button>
              <button data-delete="${trip.id}" class="text-slate-400 hover:text-red-400 p-1 delete-trip-btn">🗑️</button>
            </div>
          </div>
        `;
      }

      function escapeHtml(text) {
        return String(text).replace(/[&<>"]/g, function(m) {
          if (m === '&') return '&amp;';
          if (m === '<') return '&lt;';
          if (m === '>') return '&gt;';
          if (m === '"') return '&quot;';
          return m;
        });
      }

      function attachTripCardEvents() {
        document.querySelectorAll('.edit-trip-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const id = e.currentTarget.getAttribute('data-edit');
            const trip = trips.find(t => t.id == id);
            if (trip) openModal(trip);
          });
        });
        document.querySelectorAll('.delete-trip-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const id = e.currentTarget.getAttribute('data-delete');
            deleteTrip(id);
          });
        });
      }

      function renderHistory() {
        const allMonths = [...new Set(trips.map(t => t.date?.substring(0,7)).filter(Boolean))].sort().reverse();
        let selectedMonth = getCurrentMonthKey();
        // Сохраняем выбранный месяц в data-атрибуте или через глобальную переменную
        if (window.historySelectedMonth && allMonths.includes(window.historySelectedMonth)) {
          selectedMonth = window.historySelectedMonth;
        } else if (allMonths.length > 0) {
          selectedMonth = allMonths[0];
        }

        const monthOptions = allMonths.map(m => `<option value="${m}" ${m===selectedMonth?'selected':''}>${getMonthName(m)}</option>`).join('');
        
        let html = `
          <div class="flex items-center justify-between mb-4">
            <h2 class="text-lg font-semibold">История поездок</h2>
            <select id="historyMonthSelect" class="w-auto bg-slate-800 border-slate-600 text-slate-200 rounded-xl px-3 py-2 text-sm">
              ${monthOptions || '<option>Нет данных</option>'}
            </select>
          </div>
          <div id="historyTripList" class="space-y-2"></div>
        `;
        mainContent.innerHTML = html;

        const historyTripList = document.getElementById('historyTripList');
        const historyMonthSelect = document.getElementById('historyMonthSelect');

        function renderHistoryTrips(monthKey) {
          window.historySelectedMonth = monthKey;
          const monthTrips = filterTripsByMonth(monthKey).sort((a,b)=> (b.date||'').localeCompare(a.date||''));
          if (monthTrips.length === 0) {
            historyTripList.innerHTML = '<div class="text-center py-10 text-slate-500">Нет поездок за этот месяц</div>';
          } else {
            historyTripList.innerHTML = monthTrips.map(trip => createTripCardHTML(trip)).join('');
            attachTripCardEvents();
          }
          const totalKm = calculateMonthKm(monthKey);
          const totalElement = document.getElementById('historyTotalKm');
          if (totalElement) totalElement.textContent = `${totalKm} км`;
        }

        if (historyMonthSelect) {
          historyMonthSelect.addEventListener('change', (e) => {
            renderHistoryTrips(e.target.value);
          });
          renderHistoryTrips(selectedMonth);
        }

        currentMonthDisplay.textContent = 'История';
      }

      function renderStats() {
        const allMonths = [...new Set(trips.map(t => t.date?.substring(0,7)).filter(Boolean))].sort();
        const monthLabels = allMonths.map(m => getMonthName(m));
        const monthData = allMonths.map(m => calculateMonthKm(m));

        // Топ направлений
        const destMap = new Map();
        trips.forEach(t => {
          const prev = destMap.get(t.destination) || 0;
          destMap.set(t.destination, prev + t.roundTripKm);
        });
        const topDest = [...destMap.entries()].sort((a,b) => b[1]-a[1]).slice(0,5);
        const destLabels = topDest.map(d => d[0]);
        const destData = topDest.map(d => d[1]);

        let html = `
          <h2 class="text-lg font-semibold mb-4">Статистика</h2>
          <div class="glass-card p-4 mb-6">
            <h3 class="text-sm text-slate-300 mb-3">Пробег по месяцам (км)</h3>
            <canvas id="monthChart" width="300" height="150"></canvas>
          </div>
          <div class="glass-card p-4">
            <h3 class="text-sm text-slate-300 mb-3">Топ направлений (км туда-обратно)</h3>
            <canvas id="destChart" width="300" height="150"></canvas>
          </div>
        `;
        mainContent.innerHTML = html;

        // Рисуем графики после вставки canvas
        setTimeout(() => {
          const monthCtx = document.getElementById('monthChart')?.getContext('2d');
          if (monthCtx) {
            new Chart(monthCtx, {
              type: 'bar',
              data: {
                labels: monthLabels,
                datasets: [{
                  label: 'км',
                  data: monthData,
                  backgroundColor: '#3b82f6',
                  borderRadius: 8
                }]
              },
              options: {
                responsive: true,
                plugins: { legend: { display: false } },
                scales: { y: { beginAtZero: true, grid: { color: '#334155' } }, x: { ticks: { color: '#cbd5e1' } } }
              }
            });
          }
          const destCtx = document.getElementById('destChart')?.getContext('2d');
          if (destCtx) {
            new Chart(destCtx, {
              type: 'pie',
              data: {
                labels: destLabels,
                datasets: [{
                  data: destData,
                  backgroundColor: ['#3b82f6','#6366f1','#8b5cf6','#a855f7','#d946ef']
                }]
              },
              options: {
                responsive: true,
                plugins: { legend: { position: 'bottom', labels: { color: '#cbd5e1' } } }
              }
            });
          }
        }, 50);
        currentMonthDisplay.textContent = 'Аналитика';
      }

      function renderCurrentTab() {
        if (currentTab === 'dashboard') renderDashboard();
        else if (currentTab === 'history') renderHistory();
        else if (currentTab === 'stats') renderStats();
      }

      function switchTab(tab) {
        currentTab = tab;
        navButtons.forEach(btn => {
          const tabValue = btn.getAttribute('data-tab');
          if (tabValue === tab) btn.classList.add('active');
          else btn.classList.remove('active');
        });
        renderCurrentTab();
      }

      // ---------- Инициализация событий ----------
      function init() {
        loadTrips();
        // Сегодняшняя дата по умолчанию
        tripDateInput.value = new Date().toISOString().slice(0,10);
        
        // Навигация
        navButtons.forEach(btn => {
          btn.addEventListener('click', (e) => {
            const tab = e.currentTarget.getAttribute('data-tab');
            switchTab(tab);
          });
        });

        // FAB кнопка
        fabButton.addEventListener('click', () => openModal(null));

        // Модальное окно
        modalOverlay.addEventListener('click', closeModal);
        cancelModalBtn.addEventListener('click', closeModal);
        tripForm.addEventListener('submit', handleFormSubmit);
        tripDistanceInput.addEventListener('input', updateRoundTripPreview);

        // Закрытие по Escape
        document.addEventListener('keydown', (e) => {
          if (e.key === 'Escape' && !modal.classList.contains('hidden')) closeModal();
        });

        // Стартовый рендер
        switchTab('dashboard');
      }

      // Запуск приложения
      init();
    })();
  </script>
</body>
</html>
